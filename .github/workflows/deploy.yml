# Deploys to Cloud Run after CI passes on main. Signs in to Google with
# Workload Identity Federation (no key file): Google only accepts a sign-in
# from this repo on main, as a short-lived token for the deployer account.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: firasah-dev-511916
  REGION: europe-west2
  # The website runs in Belgium because Cloud Run can't map a custom domain in London
  WEB_REGION: europe-west1
  REGISTRY: europe-west2-docker.pkg.dev/firasah-dev-511916/firasah

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # Deploy exactly the commit CI tested
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/647234305259/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: firasah-deployer@firasah-dev-511916.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the API image
        run: gcloud builds submit . --config cloudbuild.yaml --substitutions "_IMAGE=$REGISTRY/api:$SHA" --project "$PROJECT"

      - name: Build and push the website image
        working-directory: web
        run: >
          gcloud builds submit . --config cloudbuild.yaml --project "$PROJECT"
          --substitutions "_SUPABASE_URL=${{ vars.SUPABASE_URL }},_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }},_IMAGE=$REGISTRY/web:$SHA"

      # Settings and identity stay as configured on the service; only the image changes
      - name: Deploy the API
        run: gcloud run deploy firasah-api --image "$REGISTRY/api:$SHA" --region "$REGION" --project "$PROJECT"

      - name: Deploy the website
        run: gcloud run deploy firasah-web --image "$REGISTRY/web:$SHA" --region "$WEB_REGION" --project "$PROJECT"

      - name: Smoke test
        run: |
          api=$(gcloud run services describe firasah-api --region "$REGION" --project "$PROJECT" --format='value(status.url)')
          web=$(gcloud run services describe firasah-web --region "$WEB_REGION" --project "$PROJECT" --format='value(status.url)')
          curl -fsS "$api/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/me")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "$web/login")" = 200
