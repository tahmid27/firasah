version: 2

models:
  - name: fct_social_posts
    description: >
      One row per post across every social platform (TikTok + Instagram),
      unioned in int_social_posts_unioned. This is the table a cross-platform
      content-performance chart should query. Instagram rows get reach, shares
      and saves from the insights endpoint; view_count is only filled for
      Instagram videos (old image posts report 0 views meaning "not
      measured"). TikTok has no reach or saves. Instagram posts from before
      the account became a business account have no insights (nulls).
    columns:
      - name: post_id
        description: >
          Cross-platform unique identifier (platform + the platform's own
          post ID, e.g. "tiktok-7123456789").
        tests:
          - unique
          - not_null

      - name: platform
        description: Which platform the post is from ("tiktok" or "instagram").
        tests:
          - not_null
          - accepted_values:
              values: ["tiktok", "instagram"]

      - name: posted_at
        description: Timestamp the post was published.
        tests:
          - not_null

      - name: like_count
        description: Like count as of the most recent pull.
        tests:
          - not_null

      - name: reach
        description: >
          Unique accounts that saw the post. Instagram only (null for
          TikTok). The one visibility metric comparable across Instagram
          formats; null for posts predating the business account.

      - name: save_count
        description: Times the post was saved. Instagram only (null for TikTok).

      - name: repost_count
        description: Times the post was reposted. Instagram only.

      - name: profile_visits
        description: >
          Profile visits that came from this post. Instagram feed posts only
          (null for Reels and TikTok).

      - name: new_follower_count
        description: >
          Accounts that followed from this post. Instagram feed posts only
          (null for Reels and TikTok).

      - name: avg_watch_time_seconds
        description: Average time spent watching, in seconds. Instagram Reels only.

      - name: skip_rate
        description: >
          Percentage of initial viewers who skipped within the first 3
          seconds, as Instagram returns it (e.g. 4.4 = 4.4%). Instagram
          Reels only.

      - name: media_product_type
        description: >
          Instagram's surface the post was published to ("FEED" or "REELS") —
          the Reels-vs-feed split. Null for TikTok rows (not applicable).

  - name: fct_social_account_stats
    description: >
      One row per account per ingestion run across every social platform
      (TikTok + Instagram), unioned in int_social_account_stats_unioned.
      Not deduplicated — multiple rows per account over time is the point,
      it's what makes a follower-growth chart possible. total_likes is null
      for Instagram rows — no equivalent lifetime-total field exposed by the
      basic account fields currently pulled.
    columns:
      - name: account_id
        description: >
          Cross-platform unique identifier (platform + the platform's own
          account ID).
        tests:
          - not_null

      - name: platform
        description: Which platform the account is on ("tiktok" or "instagram").
        tests:
          - not_null
          - accepted_values:
              values: ["tiktok", "instagram"]

      - name: follower_count
        description: Follower count as of this ingestion run.
        tests:
          - not_null

  - name: fct_social_account_daily
    description: >
      One row per account per day: daily reach, views, engagement and link
      taps. Latest pull per day. Instagram only for now; TikTok's current
      access doesn't expose daily account activity.
    columns:
      - name: account_id
        description: Cross-platform account identifier, matching fct_social_account_stats.account_id.
        tests:
          - not_null

      - name: insight_date
        description: The day (UTC) the figures cover.
        tests:
          - not_null

      - name: reach
        description: Unique accounts that saw any of the account's content that day.

  - name: fct_social_follower_demographics
    description: >
      Follower demographic buckets (age, gender, country, city) per
      ingestion run. Not deduplicated — each run is a snapshot; take the
      latest ingested_at for the current audience.
    columns:
      - name: account_id
        description: Cross-platform account identifier.
        tests:
          - not_null

      - name: breakdown_type
        description: Which split the row belongs to ("age", "gender", "country" or "city").
        tests:
          - not_null

      - name: follower_count
        description: Followers in that bucket.
        tests:
          - not_null
