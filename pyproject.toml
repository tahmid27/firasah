[project]
name = "firasah"
version = "0.1.0"
description = "SaaS analytics platform for UK charities — fundraising and social data aggregation"
authors = [
    { name = "Tahmid", email = "tahmidnaser@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-bigquery>=1.12.0",
    "dbt-core>=1.12.2",
    "fastapi>=0.141.1",
    "google-cloud-bigquery>=3.43.0",
    "httpx>=0.28.1",
    "prefect>=3.8.4",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
# Put the repo root on the import path so tests can `import ingestion...`
# (same reason connectors are run with `python -m`, see CLAUDE.md)
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["dbt"]
