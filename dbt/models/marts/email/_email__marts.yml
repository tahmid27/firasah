version: 2

models:
  - name: fct_mailchimp_campaigns
    description: >
      One row per campaign, deduplicated to the latest-known version (via
      stg_mailchimp_campaign_reports). No union/intermediate layer needed —
      Mailchimp is currently the only email platform connected, unlike the
      fundraising and social domains.
    columns:
      - name: campaign_id
        description: Unique identifier for the campaign, as provided by Mailchimp.
        tests:
          - unique
          - not_null

      - name: campaign_title
        description: Internal campaign title (not the subject line shown to recipients).
        tests:
          - not_null

      - name: emails_sent
        description: Total number of emails sent for this campaign.
        tests:
          - not_null

      - name: list_id
        description: The audience/list this campaign was sent to.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_mailchimp_audience_stats')
                field: list_id

  - name: fct_mailchimp_audience_stats
    description: >
      One row per audience/list per ingestion run (via
      stg_mailchimp_audience_stats) — deliberately not deduplicated, so an
      audience-growth-over-time chart stays possible downstream.
    columns:
      - name: list_id
        description: Unique identifier for the audience/list, as provided by Mailchimp.
        tests:
          - not_null

      - name: member_count
        description: Subscriber count as of this ingestion run.
        tests:
          - not_null

  - name: fct_mailchimp_link_clicks
    description: >
      One row per link per campaign: which links in each email were
      clicked, with total and unique click counts. Latest pull per link.
    columns:
      - name: link_click_id
        description: Campaign ID plus link ID.
        tests:
          - unique
          - not_null

      - name: campaign_id
        description: Campaign the link was in.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_mailchimp_campaigns')
                field: campaign_id

      - name: url
        description: Link destination.
        tests:
          - not_null

  - name: fct_mailchimp_audience_daily
    description: >
      One row per audience per day: subscribes, unsubscribes, net change
      and email activity. Latest pull per day. Use for a daily growth chart.
    columns:
      - name: audience_day_id
        description: Audience ID plus date.
        tests:
          - unique
          - not_null

      - name: list_id
        description: Audience the day belongs to.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_mailchimp_audience_stats')
                field: list_id

      - name: activity_date
        description: The day the activity happened.
        tests:
          - not_null

  - name: fct_mailchimp_audience_monthly
    description: >
      One row per audience per month: monthly list growth. Latest pull per
      month.
    columns:
      - name: audience_month_id
        description: Audience ID plus first day of the month.
        tests:
          - unique
          - not_null

      - name: list_id
        description: Audience the month belongs to.
        tests:
          - not_null

      - name: month_start
        description: First day of the month.
        tests:
          - not_null
