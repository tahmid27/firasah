version: 2

models:
  - name: stg_justgiving_donations
    description: >
      Cleaned, typed donation records sourced from the real JustGiving API
      (via raw_justgiving_donations). Thin rename/cast layer only — the raw
      source is append-only and not deduplicated, so donation_id is not
      unique here on purpose; a donation can legitimately appear more than
      once if the ingestion flow has run multiple times. Deduplication and
      "what's the current state of this donation" logic belongs in the mart
      layer, not here.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: donation_id
        description: Unique identifier for the donation, as provided by JustGiving.
        tests:
          - not_null

      - name: donor_name
        description: >
          Display name of the donor, as sent by JustGiving (may be
          "Anonymous" or null). Missing names are handled in
          int_donations_unioned, not here.

      - name: amount
        description: Donation amount, in the currency given by currency_code.
        tests:
          - not_null

      - name: currency_code
        description: ISO currency code for the donation amount.
        tests:
          - not_null

      - name: donation_date
        description: Timestamp the donation was made.
        tests:
          - not_null

      - name: charity_id
        description: JustGiving charity ID the donation was made to.
        tests:
          - not_null

      - name: traffic_source
        description: >
          How the donation reached JustGiving, as JustGiving labels it
          (raw field `source`, e.g. "SponsoredDonationCampaign").

  - name: stg_justgiving_pages
    description: >
      One row per fundraising page per ingestion run, cleaned and typed
      (via raw_justgiving_pages). Not deduplicated: the target and running
      totals change between pulls. int_donations_unioned takes the latest
      row per page.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: page_short_name
        description: URL slug of the fundraising page; matches stg_justgiving_donations.page_short_name.
        tests:
          - not_null

      - name: page_title
        description: Title the page owner gave the page.

      - name: event_id
        description: ID of the JustGiving event/appeal the page belongs to (the larger project above individual pages).

      - name: event_name
        description: Name of that event/appeal.
        tests:
          - not_null
