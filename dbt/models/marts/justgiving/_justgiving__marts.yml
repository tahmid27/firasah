version: 2

models:
  - name: fct_justgiving_donations
    description: >
      One row per currently-active JustGiving donation — deduplicated and
      refund-aware via justgiving_donations_snapshot. This is the table a
      dashboard chart (e.g. donations over time, by channel) should query.
    columns:
      - name: donation_id
        description: Unique identifier for the donation, as provided by JustGiving.
        tests:
          - unique
          - not_null

      - name: donor_name
        description: Display name of the donor (may be "Anonymous").
        tests:
          - not_null

      - name: amount
        description: Donation amount, in the currency given by currency_code.
        tests:
          - not_null

      - name: currency_code
        description: ISO currency code for the donation amount.
        tests:
          - not_null

      - name: donation_date
        description: Timestamp the donation was made.
        tests:
          - not_null

      - name: charity_id
        description: JustGiving charity ID the donation was made to.
        tests:
          - not_null
