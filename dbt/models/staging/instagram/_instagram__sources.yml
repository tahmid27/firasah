version: 2

sources:
  - name: instagram
    description: Raw Instagram data landed by the Python ingestion script (ingestion/instagram_posts.py) via the Instagram Graph API (Facebook Login setup, for a Page-linked Instagram Business Account). Not loaded through dbt.
    database: firasah-dev-511916
    schema: firasah_dev
    tables:
      - name: raw_instagram_account_info
        description: >
          Raw account-level stats for the connected Instagram Business
          Account — follower/following/media counts at the time of the
          pull. Append-only, one row per ingestion run, not deduplicated
          at this layer on purpose.
        loaded_at_field: _ingested_at

      - name: raw_instagram_media
        description: >
          Raw media (post) records for the connected Instagram Business
          Account. Append-only — every ingestion run lands a full
          snapshot of the account's media, tagged with _ingested_at, so
          the same post can appear multiple times across runs. Not
          deduplicated at this layer on purpose.
        loaded_at_field: _ingested_at

      - name: raw_instagram_media_insights
        description: >
          Raw per-post insight metrics (reach, views, shares, saves, total
          interactions) from the Graph API's separate insights endpoint.
          Append-only, one row per post per run. Posts published before the
          account became a business account have no insights and no row.
        loaded_at_field: _ingested_at

      - name: raw_instagram_account_insights_daily
        description: >
          Raw account-level daily totals (reach, views, engagement, saves,
          link taps, ...). One row per day per pull; each run re-pulls the
          most recent days (Instagram data lags up to 48 hours), so the same
          day appears multiple times. Append-only.
        loaded_at_field: _ingested_at

      - name: raw_instagram_follower_demographics
        description: >
          Raw follower demographics: one row per breakdown bucket (age band,
          gender, country, city) per pull. A snapshot per run, so the
          history shows how the audience shifts. Instagram returns at most
          the top 45 buckets per breakdown and needs 100+ followers.
        loaded_at_field: _ingested_at
