version: 2

models:
  - name: fct_donations
    description: >
      One row per donation across every fundraising platform (JustGiving +
      LaunchGood), unioned in int_donations_unioned. This is the table a
      cross-platform dashboard chart (e.g. total raised over time, by
      platform) should query. Refund/cancellation handling currently only
      applies to the JustGiving side (via justgiving_donations_snapshot) —
      LaunchGood donations are all treated as currently-active, since there's
      no reliable way yet to detect one disappearing between CSV exports.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: donation_id
        description: >
          Cross-platform unique identifier (source platform + the
          platform's own donation ID, e.g. "justgiving-12345").
        tests:
          - unique_per_org
          - not_null

      - name: source
        description: Which platform the donation came from ("justgiving" or "launchgood").
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["justgiving", "launchgood"]

      - name: donation_date
        description: Timestamp the donation was made.
        tests:
          - not_null

      - name: amount
        description: Donation amount, in the currency given by currency_code.
        tests:
          - not_null

      - name: currency_code
        description: >
          ISO currency code for the donation amount. Amounts are NOT
          converted: every total in the mart assumes GBP, which the warning
          test below enforces — see CLAUDE.md for the pending conversion
          decision.
        tests:
          - not_null
          # Warns (does not fail) the moment a non-GBP donation appears, so
          # totals can't silently mix currencies before conversion exists.
          - accepted_values:
              arguments:
                values: ["GBP"]
              config:
                severity: warn

      - name: donor_name
        description: >
          Donor display name; "Anonymous" for anonymous donors (missing,
          blank or placeholder names, or LaunchGood's anonymous-donor
          setting) so the column is always filled.
        tests:
          - not_null

      - name: is_anonymous
        description: >
          True if the donor is anonymous. Anonymous donors should be
          excluded from any named-donor list or donor-level analysis.
        tests:
          - not_null

      - name: fundraiser_name
        description: >
          The individual fundraising page the donation went to (JustGiving
          page title, or LaunchGood campaign name). Ranks fundraisers within
          a project.
        tests:
          - not_null

      - name: project_name
        description: >
          The larger project or appeal the fundraiser belongs to (JustGiving
          event name, or LaunchGood community name). Groups fundraisers so a
          whole project can be tracked and drilled into.

      - name: traffic_source
        description: >
          How the donation arrived, as each platform labels it (JustGiving
          `source`, LaunchGood `source`). Labels are platform-specific, not
          harmonised into shared categories.

      - name: is_online
        description: >
          Whether the donation was made online (true) or offline (false).
          LaunchGood only — null for JustGiving.

      - name: zakat_amount
        description: >
          Portion of the donation given as Zakat, in currency_code. LaunchGood
          only — null for JustGiving, and null for non-Zakat LaunchGood
          donations.

      - name: processing_fees
        description: >
          Card processing fees deducted, in settlement_currency (not
          currency_code). LaunchGood only — null for JustGiving.

      - name: net_amount
        description: >
          What the charity actually receives after fees, in
          settlement_currency (not currency_code). LaunchGood only — null for
          JustGiving.

      - name: settlement_currency
        description: >
          Currency processing_fees and net_amount are paid out in. LaunchGood
          only — null for JustGiving.

      - name: has_marketing_consent
        description: >
          Whether the donor opted in to marketing contact. LaunchGood only —
          null for JustGiving (not exposed by its donations endpoint).

  - name: dim_fundraising_pages
    description: >
      One row per JustGiving fundraising page (latest pull): project, owner,
      status, target and JustGiving's own totals, including its estimate of
      Gift Aid. A fundraising_target of 0 means the page has no target.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: page_short_name
        description: The page's URL slug.
        tests:
          - not_null
          - unique_per_org

      - name: fundraiser_name
        description: Page title, matching fct_donations.fundraiser_name.
        tests:
          - not_null
