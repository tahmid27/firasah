version: 2

models:
  - name: fct_mailchimp_campaigns
    description: >
      One row per campaign, deduplicated to the latest-known version (via
      stg_mailchimp_campaign_reports). No union/intermediate layer needed —
      Mailchimp is currently the only email platform connected, unlike the
      fundraising and social domains.
    columns:
      - name: campaign_id
        description: Unique identifier for the campaign, as provided by Mailchimp.
        tests:
          - unique
          - not_null

      - name: campaign_title
        description: Internal campaign title (not the subject line shown to recipients).
        tests:
          - not_null

      - name: emails_sent
        description: Total number of emails sent for this campaign.
        tests:
          - not_null

      - name: list_id
        description: The audience/list this campaign was sent to.
        tests:
          - not_null
          - relationships:
              to: ref('fct_mailchimp_audience_stats')
              field: list_id

  - name: fct_mailchimp_audience_stats
    description: >
      One row per audience/list per ingestion run (via
      stg_mailchimp_audience_stats) — deliberately not deduplicated, so an
      audience-growth-over-time chart stays possible downstream.
    columns:
      - name: list_id
        description: Unique identifier for the audience/list, as provided by Mailchimp.
        tests:
          - not_null

      - name: member_count
        description: Subscriber count as of this ingestion run.
        tests:
          - not_null
