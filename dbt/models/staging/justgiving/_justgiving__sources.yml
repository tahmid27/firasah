version: 2

sources:
  - name: justgiving
    description: Raw JustGiving data landed by the Python ingestion script (ingestion/justgiving_donations.py) — not loaded through dbt.
    database: firasah-dev
    schema: firasah_dev
    tables:
      - name: raw_justgiving_donations
        description: >
          Raw donation records for a JustGiving fundraising page. Append-only —
          every ingestion run lands a full snapshot of the page's donations,
          tagged with _ingested_at, so the same donation can appear multiple
          times across runs. Not deduplicated at this layer on purpose.
        loaded_at_field: _ingested_at
