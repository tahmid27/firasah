version: 2

models:
  - name: stg_mailchimp_campaign_reports
    description: >
      Cleaned, typed campaign report data from the Mailchimp Marketing API
      (via raw_mailchimp_campaign_reports), with Mailchimp's nested
      opens/clicks/bounces objects flattened into plain columns. Thin
      rename/cast layer only — not deduplicated, same reasoning as every
      other staging model in this project.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: campaign_id
        description: Unique identifier for the campaign, as provided by Mailchimp.
        tests:
          - not_null

      - name: campaign_title
        description: Internal campaign title (not the subject line shown to recipients).
        tests:
          - not_null

      - name: emails_sent
        description: Total number of emails sent for this campaign.
        tests:
          - not_null

      - name: unique_opens
        description: >
          Number of unique recipients who opened the email, per
          Mailchimp's pixel-based open tracking. A genuine undercount for
          recipients whose email client blocks remote images by default
          (e.g. junk-foldered mail) — see CLAUDE.md for the real example
          that surfaced this.

      - name: unique_clicks
        description: Number of unique recipients who clicked a tracked link.

  - name: stg_mailchimp_audience_stats
    description: >
      Cleaned, typed audience/list-level stats from the Mailchimp Marketing
      API (via raw_mailchimp_audience_stats), with Mailchimp's nested
      stats object flattened into plain columns.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: list_id
        description: Unique identifier for the audience/list, as provided by Mailchimp.
        tests:
          - not_null

      - name: member_count
        description: Current number of subscribers in this audience.
        tests:
          - not_null

  - name: stg_mailchimp_campaign_link_clicks
    description: >
      Per-link click counts for each sent campaign (via
      raw_mailchimp_campaign_link_clicks). Thin rename layer, not
      deduplicated — counts grow after a send, so fct_mailchimp_link_clicks
      keeps the latest pull per link.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: campaign_id
        description: Campaign the link was in; matches stg_mailchimp_campaign_reports.campaign_id.
        tests:
          - not_null

      - name: link_id
        description: Mailchimp's identifier for this link within the campaign.
        tests:
          - not_null

      - name: url
        description: The link's destination address.
        tests:
          - not_null

  - name: stg_mailchimp_list_activity_daily
    description: >
      Daily audience activity (via raw_mailchimp_list_activity_daily). Not
      deduplicated — each run re-lands the recent window.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: list_id
        description: Audience the activity belongs to.
        tests:
          - not_null

      - name: activity_date
        description: The day the activity happened.
        tests:
          - not_null

      - name: new_subscribers
        description: People who subscribed that day (Mailchimp's `subs`).

      - name: unsubscribes
        description: People who unsubscribed that day (Mailchimp's `unsubs`).

  - name: stg_mailchimp_list_growth_monthly
    description: >
      Monthly audience growth (via raw_mailchimp_list_growth_monthly). Not
      deduplicated — the current month's figures change between runs.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: list_id
        description: Audience the figures belong to.
        tests:
          - not_null

      - name: month_start
        description: First day of the month the figures cover.
        tests:
          - not_null

  - name: stg_mailchimp_campaign_timeseries
    description: Hour-by-hour opens and clicks for the 24 hours after each campaign send, per pull.
    columns:
      - name: org_id
        description: Firasah tenant (charity) the row belongs to, stamped at ingestion.
        tests:
          - not_null

      - name: campaign_id
        description: Campaign the hour belongs to.
        tests:
          - not_null

      - name: hour_start
        description: Start of the hour.
        tests:
          - not_null
