version: 2

sources:
  - name: mailchimp
    description: Raw Mailchimp data landed by the Python ingestion script (ingestion/mailchimp_campaigns.py) via the Mailchimp Marketing API. Not loaded through dbt.
    database: firasah-dev-511916
    schema: firasah_dev
    tables:
      - name: raw_mailchimp_campaign_reports
        description: >
          Raw campaign report data for every campaign that has actually
          sent (drafts are filtered out before ingestion, since they have
          no report data). Nested fields (opens, clicks, bounces, ...)
          land as BigQuery STRUCT columns, matching Mailchimp's nested
          JSON response shape. Append-only, not deduplicated at this
          layer on purpose.
        loaded_at_field: _ingested_at

      - name: raw_mailchimp_audience_stats
        description: >
          Raw audience/list-level stats (subscriber counts, engagement
          rates, ...). Nested fields land as BigQuery STRUCT columns,
          matching Mailchimp's nested JSON response shape. Append-only,
          not deduplicated at this layer on purpose.
        loaded_at_field: _ingested_at

      - name: raw_mailchimp_campaign_link_clicks
        description: >
          Raw per-link click counts for each sent campaign (which links in
          the email were clicked). Append-only: click counts keep growing
          after a send, so every run lands the current figure again.
        loaded_at_field: _ingested_at

      - name: raw_mailchimp_list_activity_daily
        description: >
          Raw daily audience activity (subscribes, unsubscribes, emails
          sent, opens, clicks, bounces). Mailchimp returns a rolling window
          of recent days, so each run re-lands overlapping days. Append-only.
        loaded_at_field: _ingested_at

      - name: raw_mailchimp_list_growth_monthly
        description: >
          Raw monthly audience growth (subscribed, unsubscribed, cleaned,
          imports, opt-ins ...). Append-only; the current month's figures
          change between runs.
        loaded_at_field: _ingested_at
