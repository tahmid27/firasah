# Runs on every push to main and every pull request. Checks code quality and
# that the dbt project fits together — without touching any real API or
# BigQuery, so it needs no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact version tags only (no moving `v10` tag)
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q

      # Checks every model, ref, source and YAML file fits together. Uses a
      # placeholder profile (ci/profiles.yml) — parse never connects to
      # BigQuery. A full `dbt build` in CI needs a keyless GCP login
      # (Workload Identity Federation), not set up yet.
      - name: dbt parse
        run: uv run dbt parse --project-dir dbt --profiles-dir ci --no-partial-parse

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      # The frontend's API types are generated from the backend's OpenAPI
      # spec. Fails if the API changed without regenerating them.
      - name: API types match the backend
        run: |
          (cd .. && uv sync --locked)
          npm run gen:api
          git diff --exit-code -- openapi.json src/lib/api-types.ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          FIRASAH_API_URL: http://localhost:8000
