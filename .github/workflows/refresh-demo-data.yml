# Rebuilds the synthetic demo dataset every morning so the live demo is never
# "Out of date". Keyless Google sign-in as a refresh account that can write only
# to the synthetic dataset.
#
# DEMO-ONLY SHORTCUT: real charities need a hosted Cloud Run Job on Cloud
# Scheduler, not a GitHub schedule. See "MUST FIX BEFORE ONBOARDING REAL
# CLIENTS" in CLAUDE.local.md.
name: Refresh demo data

on:
  schedule:
    # GitHub's scheduler is best-effort: runs can start hours late or not at
    # all. So there are several attempts a day, and an attempt does nothing if
    # the data is already fresh. All are after 07:00 UTC, when the generator
    # treats "today" as a finished day.
    - cron: "17 7,10,13,16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: refresh-demo-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_CLOUD_PROJECT: firasah-dev-511916
      DBT_PROFILES_DIR: ci/synthetic
      # The generator imports the real connectors' parsing code, and those read
      # their keys on import. Synthetic data makes no real API calls, so these
      # are placeholders (same as tests/conftest.py).
      JUSTGIVING_APP_ID: placeholder
      MAILCHIMP_API_KEY: placeholder-us1
      INSTAGRAM_ACCESS_TOKEN: placeholder
      TIKTOK_CLIENT_KEY: placeholder
      TIKTOK_CLIENT_SECRET: placeholder
      TIKTOK_REFRESH_TOKEN: placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/647234305259/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: firasah-refresh@firasah-dev-511916.iam.gserviceaccount.com

      # Scheduled attempts skip when a recent run already refreshed the data;
      # a manual run always goes ahead.
      - name: Skip if the data is already fresh
        id: guard
        if: github.event_name == 'schedule'
        run: |
          uv run python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import sys
          from datetime import UTC, datetime, timedelta
          from google.cloud import bigquery

          fresh = False
          try:
              row = list(bigquery.Client().query(
                  "select min(last_data_at) as oldest "
                  "from `firasah-dev-511916.firasah_synthetic.fct_source_status`"
              ).result())[0]
              age = datetime.now(UTC) - row.oldest
              fresh = age < timedelta(hours=18)
              print(f"data is {age} old", file=sys.stderr)
          except Exception as e:  # no table yet, or anything odd: just refresh
              print(f"could not check freshness ({type(e).__name__}); refreshing",
                    file=sys.stderr)
          print(f"fresh={str(fresh).lower()}")
          PY

      # Keeps yesterday's dashboard tables in place until dbt rebuilds them
      - name: Regenerate, load and rebuild the synthetic dataset
        if: steps.guard.outputs.fresh != 'true'
        run: uv run python -m synthetic.load --skip-supabase --keep-marts

      - name: Check the data is fresh
        if: steps.guard.outputs.fresh != 'true'
        run: |
          uv run python - <<'PY'
          from datetime import date, timedelta
          from google.cloud import bigquery

          rows = list(bigquery.Client().query(
              "select org_id, max(date(donation_date)) as latest, count(*) as n "
              "from `firasah-dev-511916.firasah_synthetic.fct_donations` group by org_id"
          ).result())
          for r in rows:
              print(r.org_id, r.latest, r.n)
          assert len(rows) == 3, f"expected 3 charities, got {len(rows)}"
          stale = [r.org_id for r in rows if r.latest < date.today() - timedelta(days=2)]
          assert not stale, f"stale data for {stale}"
          from datetime import UTC, datetime
          oldest = list(bigquery.Client().query(
              "select min(last_data_at) as t "
              "from `firasah-dev-511916.firasah_synthetic.fct_source_status`"
          ).result())[0].t
          age = datetime.now(UTC) - oldest
          assert age < timedelta(hours=2), f"latest data is {age} old"
          print("latest data is", age, "old")
          PY
