version: 2

models:
  - name: stg_instagram_account_info
    description: >
      Cleaned, typed account-level stats from the Instagram Graph API (via
      raw_instagram_account_info). One row per ingestion run — the mart
      layer decides "current" vs. "historical" account stats, same
      pattern as stg_tiktok_user_info.
    columns:
      - name: account_id
        description: Instagram Business Account ID, as provided by the Graph API.
        tests:
          - not_null

      - name: followers_count
        description: Follower count at the time of the pull.
        tests:
          - not_null

  - name: stg_instagram_media
    description: >
      Cleaned, typed media (post) records from the Instagram Graph API
      (via raw_instagram_media). Thin rename/cast layer only — not
      deduplicated, same reasoning as every other staging model in this
      project.
    columns:
      - name: media_id
        description: Unique identifier for the media item, as provided by the Graph API.
        tests:
          - not_null

      - name: posted_at
        description: Timestamp the media was posted.
        tests:
          - not_null

      - name: account_id
        description: >
          Instagram Business Account ID this media belongs to. Not carried
          through into fct_social_posts yet — see CLAUDE.md for why a
          cross-platform account_id link isn't possible there until TikTok's
          raw video data carries an equivalent field.
        tests:
          - not_null

  - name: stg_instagram_media_insights
    description: >
      Per-post insight metrics from Instagram's insights endpoint (via
      raw_instagram_media_insights). Thin rename layer, not deduplicated —
      metrics grow after posting, so int_social_posts_unioned takes the
      latest row per post. Posts from before the account became a business
      account have no row here.
    columns:
      - name: media_id
        description: Media item these metrics belong to; matches stg_instagram_media.media_id.
        tests:
          - not_null

      - name: reach
        description: Unique accounts that saw the post. The only metric that is meaningful for every format.
        tests:
          - not_null

      - name: view_count
        description: >
          Views. Only meaningful for video/Reels — old image and carousel
          posts report 0, which means "not measured", not "no one saw it".

  - name: stg_instagram_account_insights_daily
    description: >
      Account-level daily totals from Instagram insights (via
      raw_instagram_account_insights_daily). Thin rename layer, not
      deduplicated: each run re-pulls recent days, so a date can appear
      more than once. fct_social_account_daily keeps the latest pull per
      day.
    columns:
      - name: account_id
        description: Instagram Business Account ID.
        tests:
          - not_null

      - name: insight_date
        description: The day (UTC) the totals cover.
        tests:
          - not_null

      - name: reach
        description: Unique accounts that saw any of the account's content that day.

  - name: stg_instagram_follower_demographics
    description: >
      Follower demographic buckets per pull (via
      raw_instagram_follower_demographics). Not deduplicated — one set of
      rows per ingestion run is the point.
    columns:
      - name: breakdown_type
        description: Which split this row belongs to ("age", "gender", "country" or "city").
        tests:
          - not_null
          - accepted_values:
              values: ["age", "gender", "country", "city"]

      - name: breakdown_value
        description: The bucket within that split (e.g. "18-24", "F", "GB", "Salford, England").
        tests:
          - not_null

      - name: follower_count
        description: Followers in that bucket.
        tests:
          - not_null
